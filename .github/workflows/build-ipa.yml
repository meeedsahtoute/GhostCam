name: Build Unsigned GhostCam IPA

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build LiveContainer IPA
    runs-on: macos-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          if [ -d "/Applications/Xcode_16.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.app
          elif [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app
          elif [ -d "/Applications/Xcode.app" ]; then
            sudo xcode-select -s /Applications/Xcode.app
          fi
          xcodebuild -version

      - name: Install XcodeGen
        run: which xcodegen || brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build GhostCam (LiveContainer Compatible)
        run: |
          xcodebuild clean build \
            -project GhostCam.xcodeproj \
            -scheme GhostCam \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath derived_data \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_IDENTITY=""

      - name: Package GhostCam.ipa
        run: |
          mkdir -p build_output/Payload
          APP_PATH=$(find derived_data -name "GhostCam.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: GhostCam.app not found in derived_data!"
            exit 1
          fi
          echo "Found GhostCam.app at: $APP_PATH"
          cp -R "$APP_PATH" build_output/Payload/
          cd build_output
          zip -r ../GhostCam.ipa Payload
          cd ..
          ls -lh GhostCam.ipa

      - name: Upload GhostCam.ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GhostCam-unsigned-ipa
          path: GhostCam.ipa

      - name: Create Automatic GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'GhostCam Pro v1.0.0' }}
          body: |
            ## GhostCam Pro Release
            
            - **GhostCam.ipa**: Production-grade native iOS Pro Camera for iPhone 12 with full manual controls, live Metal GPU LUTs, and memory-safe 90MP Multi-Frame Super-Resolution.
            - Built for LiveContainer, TrollStore, AltStore, and SideStore sideloading.
          draft: false
          prerelease: false
          files: GhostCam.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

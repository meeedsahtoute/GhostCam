name: Build Unsigned GhostCam IPA

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select latest Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer || true

      - name: Build unsigned GhostCam.app
        run: |
          xcodebuild \
            -project GhostCam.xcodeproj \
            -scheme GhostCam \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            build

      - name: Package GhostCam.ipa
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/GhostCam.app Payload/
          zip -r GhostCam.ipa Payload

      - name: Upload GhostCam.ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GhostCam-unsigned-ipa
          path: GhostCam.ipa

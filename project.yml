name: GhostCam
options:
  bundleIdPrefix: com.ghostcam
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_BITCODE: NO
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    AD_HOC_CODE_SIGNING_ALLOWED: YES

targets:
  GhostCam:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: GhostCam/App
      - path: GhostCam/Engine
      - path: GhostCam/UI
      - path: GhostCam/Resources/Assets.xcassets
    info:
      path: GhostCam/App/Info.plist
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
        PRODUCT_NAME: GhostCam
        PRODUCT_BUNDLE_IDENTIFIER: com.ghostcam.pro
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        AD_HOC_CODE_SIGNING_ALLOWED: YES

  GhostCamTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: GhostCamTests
    dependencies:
      - target: GhostCam
    info:
      path: GhostCamTests/Info.plist
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
        PRODUCT_NAME: GhostCamTests
        PRODUCT_BUNDLE_IDENTIFIER: com.ghostcam.pro.tests
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO

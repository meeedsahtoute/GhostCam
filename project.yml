name: GhostCam
options:
  bundleIdPrefix: com.ghostcam
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_BITCODE: NO
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    AD_HOC_CODE_SIGNING_ALLOWED: YES

targets:
  GhostCam:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - GhostCam/App
      - GhostCam/Engine
      - GhostCam/UI
      - GhostCam/Resources/Assets.xcassets
    info:
      path: GhostCam/App/Info.plist
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_NAME: GhostCam
        PRODUCT_BUNDLE_IDENTIFIER: com.ghostcam.pro
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Manual
